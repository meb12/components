<div class="container">
  <select
    [id]="id"
    [ngClass]="!value ? 'option-empty' : 'option-text'"
    [class.has-error]="hasError"
    class="select-container"
    [value]="value ?? ''"
    [disabled]="disabled"
    [attr.aria-label]="placeholder"
    [attr.aria-invalid]="hasError ? 'true' : 'false'"
    [attr.aria-label]="label"
    (change)="updateValue($event)"
    (blur)="onBlur()"
  >
    <option value="" disabled>
      {{ placeholder }}
    </option>

    @for (option of options; track option.value) {
      <option
        class="option-text"
        [ngClass]="{ 'option-disabled': option.disabled }"
        [value]="option.value"
        [disabled]="option.disabled"
      >
        {{ option.label }}
      </option>
    }
  </select>

  <mat-icon class="select-icon" aria-hidden="true">keyboard_arrow_down</mat-icon>
</div>
